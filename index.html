<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>勝創建 管理アプリ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>勝創建 管理アプリ</h1>
      <p id="syncStatus">● 接続待ち</p>
    </div>
    <button id="logoutBtn" class="header-btn hidden">ログアウト</button>
  </header>

  <section id="authView" class="auth-wrap">
    <div class="card auth-card">
      <h2>ログイン</h2>
      <label>メールアドレス</label>
      <input id="emailInput" type="email" autocomplete="email">
      <label>パスワード</label>
      <input id="passwordInput" type="password" autocomplete="current-password">
      <button id="loginBtn" class="primary">ログイン</button>
      <button id="registerBtn">新規アカウント作成</button>
      <p id="authError" class="error"></p>
    </div>
  </section>

  <section id="appView" class="hidden">
    <nav id="nav" class="tabs">
      <button class="on" data-page="home">🏠 ホーム</button>
      <button data-page="attendance">👷 出面</button>
      <button data-page="profit" data-admin>💰 利益</button>
      <button data-page="expense" data-admin>🧾 経費</button>
      <button data-page="material">📦 材料</button>
      <button data-page="graph" data-admin>📈 グラフ</button>
      <button data-page="settings" data-admin>⚙️ 登録</button>
    </nav>

    <main>
      <section id="home" class="page on">
        <div class="card">
          <div class="title-row">
            <h2>今日と今月</h2>
            <span id="roleBadge" class="badge">従業員</span>
          </div>
          <div class="stats">
            <div class="stat"><strong id="todayManDays">0</strong><span>今日の人工</span></div>
            <div class="stat"><strong id="monthProfit">¥0</strong><span>今月利益</span></div>
            <div class="stat"><strong id="monthUnpaid">¥0</strong><span>未入金</span></div>
          </div>
        </div>
        <div class="card">
          <h2>現場一覧</h2>
          <div id="homeSites" class="list-empty">現場がありません</div>
        </div>
      </section>

      <section id="attendance" class="page">
        <div class="card">
          <h2>出面入力</h2>
          <div class="form-grid">
            <div>
              <label>日付</label>
              <input id="attDate" type="date">
            </div>
            <div>
              <label>現場</label>
              <select id="attSite"></select>
            </div>
          </div>
          <label>名前をタップ</label>
          <div id="workerButtons" class="choice-grid"></div>
          <div class="quick-grid">
            <button id="fullDayBtn" class="primary quick">1日<br><small>1人工</small></button>
            <button id="halfDayBtn" class="quick">半日<br><small>0.5人工</small></button>
          </div>
          <label>メモ</label>
          <input id="attMemo" placeholder="任意">
          <button id="saveAttendanceBtn" class="primary">この出面を登録</button>
          <p id="attMessage" class="success"></p>
        </div>

        <div class="card">
          <div class="title-row">
            <h2>月別集計</h2>
            <input id="attendanceMonth" class="month-input" type="month">
          </div>
          <div class="stats">
            <div class="stat"><strong id="monthManDays">0</strong><span>合計人工</span></div>
            <div class="stat"><strong id="monthWorkerCount">0</strong><span>人数</span></div>
            <div class="stat"><strong id="monthAttendanceCount">0</strong><span>登録件数</span></div>
          </div>
          <div id="attendanceSummary"></div>
        </div>

        <div class="card">
          <h2>出面履歴</h2>
          <div id="attendanceList" class="record-list"></div>
        </div>
      </section>

      <section id="profit" class="page admin-page">
        <div class="card">
          <h2>現場利益を登録</h2>
          <div class="form-grid">
            <div><label>対象月</label><input id="profitMonth" type="month"></div>
            <div><label>現場</label><select id="profitSite"></select></div>
            <div><label>施工㎡</label><input id="profitSqm" type="number" inputmode="decimal"></div>
            <div><label>㎡単価</label><input id="profitSqmPrice" type="number" inputmode="numeric"></div>
            <div><label>人工</label><input id="profitDays" type="number" step="0.5" inputmode="decimal"></div>
            <div><label>平均人工単価</label><input id="profitDayPrice" type="number" inputmode="numeric"></div>
            <div><label>追加材料費（手入力）</label><input id="profitMaterial" type="number" inputmode="numeric"></div>
            <div><label>その他原価（手入力）</label><input id="profitOther" type="number" inputmode="numeric"></div>
          </div>
          <div class="calc-box">
            <span>売上 <b id="calcSales">¥0</b></span>
            <span>総原価 <b id="calcCost">¥0</b></span>
            <span>利益 <b id="calcProfit">¥0</b></span>
          </div>
          <div class="linked-costs">
            <span>材料タブ自動反映：<b id="calcAutoMaterial">¥0</b></span>
            <span>経費タブ自動反映：<b id="calcAutoExpense">¥0</b></span>
          </div>
          <button id="saveProfitBtn" class="primary">利益を登録</button>
        </div>
        <div class="card">
          <h2>利益一覧</h2>
          <div id="profitList" class="record-list"></div>
        </div>
      </section>

      <section id="expense" class="page admin-page">
        <div class="card">
          <h2>経費登録</h2>
          <div class="form-grid">
            <div><label>日付</label><input id="expenseDate" type="date"></div>
            <div><label>現場</label><select id="expenseSite"></select></div>
            <div>
              <label>種類</label>
              <select id="expenseType">
                <option>駐車場代</option><option>ガソリン代</option><option>道具代</option>
                <option>材料費（手入力）</option><option>運搬費</option><option>斫り</option><option>その他</option>
              </select>
            </div>
            <div><label>金額</label><input id="expenseAmount" type="number" inputmode="numeric"></div>
          </div>
          <label>メモ</label><input id="expenseMemo" placeholder="任意">
          <button id="saveExpenseBtn" class="primary">経費を登録</button>
        </div>
        <div class="card"><h2>経費一覧</h2><div id="expenseList" class="record-list"></div></div>
      </section>

      <section id="material" class="page">
        <div class="card admin-only">
          <h2>材料の入出庫</h2>
          <div class="form-grid">
            <div>
              <label>材料</label>
              <select id="materialType">
                <option>ベニヤ 3×6</option><option>ベニヤ 2×6</option>
                <option>サンギ 3.5m</option><option>サンギ 3.0m</option>
                <option>パイプ</option><option>バタ角</option><option>目地棒</option>
                <option>面木</option><option>アンコ材</option>
              </select>
            </div>
            <div><label>保管場所・使用現場</label><select id="materialSite"></select></div>
            <div><label>数量</label><input id="materialQty" type="number" step="0.01" inputmode="decimal"></div>
            <div>
              <label>操作</label>
              <select id="materialAction"><option value="in">入庫・購入</option><option value="out">出庫・使用</option></select>
            </div>
            <div><label>単価</label><input id="materialUnitPrice" type="number" inputmode="numeric"></div>
            <div><label>日付</label><input id="materialDate" type="date"></div>
          </div>
          <p class="material-note">現場を選んで「入庫・購入」すると、その現場の材料費へ自動反映します。倉庫を選んだ分は会社在庫となり、現場利益には入りません。</p>
          <button id="saveMaterialBtn" class="primary">材料データを登録</button>
        </div>
        <div class="card">
          <h2>現在の在庫</h2>
          <div id="stockList"></div>
        </div>
        <div class="card"><h2>入出庫履歴</h2><div id="materialList" class="record-list"></div></div>
      </section>

      <section id="graph" class="page admin-page">
        <div class="card"><h2>月ごとの利益</h2><canvas id="profitChart" width="900" height="320"></canvas></div>
        <div class="card"><h2>人工推移</h2><canvas id="attendanceChart" width="900" height="320"></canvas></div>
        <div class="card"><h2>現場別利益</h2><canvas id="siteProfitChart" width="900" height="320"></canvas></div>
      </section>

      <section id="settings" class="page admin-page">
        <div class="card">
          <h2>従業員登録</h2>
          <div class="form-grid">
            <div><label>名前</label><input id="workerName" placeholder="例：たけし"></div>
            <div>
              <label>区分</label>
              <select id="workerType"><option>自社</option><option>外注</option><option>応援</option></select>
            </div>
            <div><label>1人工単価</label><input id="workerPrice" type="number" inputmode="numeric"></div>
            <div>
              <label>在籍状態</label>
              <select id="workerActive"><option value="true">在籍</option><option value="false">退職・非表示</option></select>
            </div>
          </div>
          <button id="saveWorkerBtn" class="primary">従業員を登録</button>
          <div id="workerList" class="record-list"></div>
        </div>

        <div class="card">
          <h2>現場登録</h2>
          <div class="form-grid">
            <div><label>現場名</label><input id="siteName" placeholder="例：杉並宮前"></div>
            <div><label>元請・請求先</label><input id="siteClient" placeholder="任意"></div>
            <div><label>開始日</label><input id="siteStart" type="date"></div>
            <div><label>終了予定日</label><input id="siteEnd" type="date"></div>
          </div>
          <button id="saveSiteBtn" class="primary">現場を登録</button>
          <div id="siteList" class="record-list"></div>
        </div>
      </section>
    </main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
